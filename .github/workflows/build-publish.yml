name: build-publish

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream release tag (e.g. v2.15.1). Empty = latest release."
        required: false
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - patch-next-standalone.js
      - ci/**
      - .github/workflows/build-publish.yml

env:
  IMAGE_NAME: linkwarden-slim
  UPSTREAM_URL: https://github.com/linkwarden/linkwarden.git
  POSTGRES_REF: postgres:16-alpine
  MEILI_REF: getmeili/meilisearch:v1.13.3
  NODE_REF: node:lts-bookworm-slim
  RUST_REF: rust:1.96-bookworm
  MONOLITH_VERSION: 2.10.1

jobs:
  test-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate workflow structure
        run: bash ci/workflow.test.sh

      - name: Run Node CI tests
        run: node --test ci/*.test.mjs ci/lib/*.test.mjs

      - name: Run shell CI tests
        run: |
          set -euo pipefail
          for test_script in ci/*.test.sh; do
            CI_RUN_NETWORK_TESTS=0 bash "$test_script"
          done

  validate-packaging:
    if: github.event_name == 'push'
    needs: test-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate workflow structure
        run: bash ci/workflow.test.sh

      - name: Resolve validation inputs
        id: inputs
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          packaging_url="https://github.com/${GITHUB_REPOSITORY}.git"
          regctl_path="$RUNNER_TEMP/regctl"
          bash ci/download-regctl.sh "$regctl_path"
          docker_config="$(mktemp -d "$RUNNER_TEMP/linkwarden-docker-config.XXXXXX")"
          trap 'rm -rf "$docker_config"' EXIT
          export DOCKER_CONFIG="$docker_config"
          REGCTL_PATH="$regctl_path" bash ci/registry-probe.sh
          input_json="$RUNNER_TEMP/linkwarden-validation-input.json"
          bash ci/resolve-publish-input.sh \
            --out "$input_json" \
            --regctl "$regctl_path" \
            --packaging-url "$packaging_url" \
            --packaging-sha "$GITHUB_SHA" \
            --upstream-tag "$version" \
            --upstream-url "$UPSTREAM_URL" \
            --postgres "$POSTGRES_REF" \
            --meili "$MEILI_REF" \
            --node "$NODE_REF" \
            --rust "$RUST_REF" \
            --monolith-version "$MONOLITH_VERSION"
          echo "input_json=$input_json" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Validate packaging and source
        run: node ci/publish.mjs validate "${{ steps.inputs.outputs.input_json }}"

  publish:
    if: github.event_name != 'push'
    needs: test-ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: linkwarden-slim-publisher
      cancel-in-progress: false
    steps:
      - name: Checkout this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve publish inputs
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          packaging_url="https://github.com/${GITHUB_REPOSITORY}.git"
          regctl_path="$RUNNER_TEMP/regctl"
          bash ci/download-regctl.sh "$regctl_path"
          docker_config="$(mktemp -d "$RUNNER_TEMP/linkwarden-docker-config.XXXXXX")"
          trap 'rm -rf "$docker_config"' EXIT
          export DOCKER_CONFIG="$docker_config"
          REGCTL_PATH="$regctl_path" bash ci/registry-probe.sh
          input_json="$RUNNER_TEMP/linkwarden-publish-input.json"
          resolver_args=(--latest-upstream --packaging-main)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then
            resolver_args=(--upstream-tag "$INPUT_VERSION" --packaging-main)
          fi
          bash ci/resolve-publish-input.sh \
            --out "$input_json" \
            --regctl "$regctl_path" \
            --packaging-url "$packaging_url" \
            --upstream-url "$UPSTREAM_URL" \
            --postgres "$POSTGRES_REF" \
            --meili "$MEILI_REF" \
            --node "$NODE_REF" \
            --rust "$RUST_REF" \
            --monolith-version "$MONOLITH_VERSION" \
            "${resolver_args[@]}"

          recipe_id="$(node -e 'process.stdout.write(require(process.argv[1]).recipe.recipeId)' "$input_json")"
          version="$(node -e 'process.stdout.write(require(process.argv[1]).upstreamTag)' "$input_json")"
          owner_lc="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          FRESH_ARGS="$(bash ci/resolve-publish-input.sh --print-fresh-args \
            --regctl "$regctl_path" \
            --packaging-url "$packaging_url" \
            --upstream-url "$UPSTREAM_URL" \
            --postgres "$POSTGRES_REF" \
            --meili "$MEILI_REF" \
            --node "$NODE_REF" \
            --rust "$RUST_REF" \
            --monolith-version "$MONOLITH_VERSION")"
          {
            echo "INPUT_JSON=$input_json"
            echo "REGCTL_PATH=$regctl_path"
            echo "FRESH_COMMAND=ci/resolve-publish-input.sh"
            echo "FRESH_ARGS=$FRESH_ARGS"
            echo "SELECTED_VERSION=$version"
            echo "RECIPE_ID=$recipe_id"
            echo "GHCR_BASE=ghcr.io/$owner_lc/$IMAGE_NAME"
            echo "PACKAGING_URL=$packaging_url"
          } >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate, stage, and publish GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node ci/publish.mjs publish-ghcr "$INPUT_JSON" \
            --regctl "$REGCTL_PATH" \
            --staging "${GHCR_BASE}:staging-${GITHUB_RUN_ID}" \
            --ghcr-candidate "${GHCR_BASE}:candidate-${RECIPE_ID}" \
            --ghcr-version "${GHCR_BASE}:${SELECTED_VERSION}" \
            --ghcr-latest "${GHCR_BASE}:latest" \
            --fresh-command "$FRESH_COMMAND" \
            --fresh-args "$FRESH_ARGS" \
            --result-out "$RUNNER_TEMP/ghcr-publish-result.json"

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mirror GHCR release to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          docker_base="docker.io/${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
          result_path="$RUNNER_TEMP/publish-result.json"
          node ci/publish.mjs mirror-docker "$INPUT_JSON" \
            --regctl "$REGCTL_PATH" \
            --ghcr-candidate "${GHCR_BASE}:candidate-${RECIPE_ID}" \
            --ghcr-version "${GHCR_BASE}:${SELECTED_VERSION}" \
            --ghcr-latest "${GHCR_BASE}:latest" \
            --docker-version "${docker_base}:${SELECTED_VERSION}" \
            --docker-latest "${docker_base}:latest" \
            --result-in "$RUNNER_TEMP/ghcr-publish-result.json" \
            --result-out "$result_path"
          node ci/summarize-publish.mjs \
            --result "$result_path" \
            --version "$SELECTED_VERSION" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --env "$GITHUB_ENV"

      - name: Update VERSION pin for the current release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/pin-version.sh
