name: build-publish

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream release tag (e.g. v2.15.1). Empty = latest release."
        required: false
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - patch-next-standalone.js
      - ci/**
      - .github/workflows/build-publish.yml

env:
  IMAGE_NAME: linkwarden-slim
  UPSTREAM_URL: https://github.com/linkwarden/linkwarden.git
  POSTGRES_REF: postgres:16-alpine
  MEILI_REF: getmeili/meilisearch:v1.13.3
  NODE_REF: node:lts-bookworm-slim
  RUST_REF: rust:1.96-bookworm
  MONOLITH_VERSION: 2.10.1

jobs:
  test-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate workflow structure
        run: bash ci/workflow.test.sh

      - name: Run Node CI tests
        run: node --test ci/*.test.mjs ci/lib/*.test.mjs

      - name: Run shell CI tests
        run: |
          set -euo pipefail
          for test_script in ci/*.test.sh; do
            if [ "$test_script" = ci/dockerfile-context.test.sh ]; then
              bash -c 'docker() { return 1; }; export -f docker; bash "$1"' -- "$test_script"
              continue
            fi
            bash "$test_script"
          done

  validate-packaging:
    if: github.event_name == 'push'
    needs: test-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate workflow structure
        run: bash ci/workflow.test.sh

      - name: Resolve validation inputs
        id: inputs
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'VERSION must be a release tag, got: %s\n' "$version" >&2
            exit 1
          fi

          tag_refs="$(git ls-remote "$UPSTREAM_URL" "refs/tags/$version^{}" "refs/tags/$version")"
          upstream_sha="$(printf '%s\n' "$tag_refs" | awk -F '\t' -v peeled="refs/tags/$version^{}" '$2 == peeled { print $1; exit }')"
          if [ -z "$upstream_sha" ]; then
            upstream_sha="$(printf '%s\n' "$tag_refs" | awk -F '\t' -v tag="refs/tags/$version" '$2 == tag { print $1; exit }')"
          fi
          if ! [[ "$upstream_sha" =~ ^[a-f0-9]{40}$ ]]; then
            printf 'Unable to resolve upstream tag to an exact SHA: %s\n' "$version" >&2
            exit 1
          fi

          packaging_url="https://github.com/${GITHUB_REPOSITORY}.git"
          packaging_sha="$GITHUB_SHA"
          if ! [[ "$packaging_sha" =~ ^[a-f0-9]{40}$ ]]; then
            printf 'GITHUB_SHA is not an exact lowercase SHA\n' >&2
            exit 1
          fi

          regctl_path="$RUNNER_TEMP/regctl"
          bash ci/download-regctl.sh "$regctl_path"
          docker_config="$(mktemp -d "$RUNNER_TEMP/linkwarden-docker-config.XXXXXX")"
          packaging_dir=""
          trap 'rm -rf "$docker_config" "$packaging_dir"' EXIT
          export DOCKER_CONFIG="$docker_config"
          REGCTL_PATH="$regctl_path" bash ci/registry-probe.sh

          packaging_dir="$(mktemp -d "$RUNNER_TEMP/linkwarden-packaging.XXXXXX")"
          bash ci/materialize-packaging.sh "$packaging_url" "$packaging_sha" "$packaging_dir"
          input_json="$RUNNER_TEMP/linkwarden-validation-input.json"
          node ci/resolve-inputs.mjs \
            --regctl "$regctl_path" \
            --packaging-url "$packaging_url" \
            --packaging-sha "$packaging_sha" \
            --packaging-export "$packaging_dir/export" \
            --upstream-tag "$version" \
            --upstream-url "$UPSTREAM_URL" \
            --upstream-sha "$upstream_sha" \
            --postgres "$POSTGRES_REF" \
            --meili "$MEILI_REF" \
            --node "$NODE_REF" \
            --rust "$RUST_REF" \
            --monolith-version "$MONOLITH_VERSION" \
            --out "$input_json"
          echo "input_json=$input_json" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Validate packaging and source
        run: node ci/publish.mjs validate "${{ steps.inputs.outputs.input_json }}"

  publish:
    if: github.event_name != 'push'
    needs: test-ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: linkwarden-slim-publisher
      cancel-in-progress: false
    steps:
      - name: Checkout this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve publish inputs
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="$(gh api repos/linkwarden/linkwarden/releases/latest --jq .tag_name)"
          fi
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Resolved version must be a release tag, got: %s\n' "$version" >&2
            exit 1
          fi

          tag_refs="$(git ls-remote "$UPSTREAM_URL" "refs/tags/$version^{}" "refs/tags/$version")"
          upstream_sha="$(printf '%s\n' "$tag_refs" | awk -F '\t' -v peeled="refs/tags/$version^{}" '$2 == peeled { print $1; exit }')"
          if [ -z "$upstream_sha" ]; then
            upstream_sha="$(printf '%s\n' "$tag_refs" | awk -F '\t' -v tag="refs/tags/$version" '$2 == tag { print $1; exit }')"
          fi
          if ! [[ "$upstream_sha" =~ ^[a-f0-9]{40}$ ]]; then
            printf 'Unable to resolve upstream tag to an exact SHA: %s\n' "$version" >&2
            exit 1
          fi

          packaging_url="https://github.com/${GITHUB_REPOSITORY}.git"
          packaging_sha="$(git ls-remote "$packaging_url" refs/heads/main | awk -F '\t' '$2 == "refs/heads/main" { print $1; exit }')"
          if ! [[ "$packaging_sha" =~ ^[a-f0-9]{40}$ ]]; then
            printf 'Unable to resolve the default packaging branch to an exact SHA\n' >&2
            exit 1
          fi

          regctl_path="$RUNNER_TEMP/regctl"
          bash ci/download-regctl.sh "$regctl_path"
          docker_config="$(mktemp -d "$RUNNER_TEMP/linkwarden-docker-config.XXXXXX")"
          packaging_dir=""
          trap 'rm -rf "$docker_config" "$packaging_dir"' EXIT
          export DOCKER_CONFIG="$docker_config"
          REGCTL_PATH="$regctl_path" bash ci/registry-probe.sh
          packaging_dir="$(mktemp -d "$RUNNER_TEMP/linkwarden-packaging.XXXXXX")"
          bash ci/materialize-packaging.sh "$packaging_url" "$packaging_sha" "$packaging_dir"

          input_json="$RUNNER_TEMP/linkwarden-publish-input.json"
          node ci/resolve-inputs.mjs \
            --regctl "$regctl_path" \
            --packaging-url "$packaging_url" \
            --packaging-sha "$packaging_sha" \
            --packaging-export "$packaging_dir/export" \
            --upstream-tag "$version" \
            --upstream-url "$UPSTREAM_URL" \
            --upstream-sha "$upstream_sha" \
            --postgres "$POSTGRES_REF" \
            --meili "$MEILI_REF" \
            --node "$NODE_REF" \
            --rust "$RUST_REF" \
            --monolith-version "$MONOLITH_VERSION" \
            --out "$input_json"

          recipe_id="$(node -e 'process.stdout.write(require(process.argv[1]).recipe.recipeId)' "$input_json")"
          owner_lc="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            echo "INPUT_JSON=$input_json"
            echo "REGCTL_PATH=$regctl_path"
            echo "FRESH_COMMAND=ci/resolve-fresh-input.sh"
            echo "SELECTED_VERSION=$version"
            echo "RECIPE_ID=$recipe_id"
            echo "GHCR_BASE=ghcr.io/$owner_lc/$IMAGE_NAME"
            echo "PACKAGING_URL=$packaging_url"
          } >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate, stage, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          docker_base="docker.io/${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
          result_path="$RUNNER_TEMP/publish-result.json"
          export FRESH_REGCTL_PATH="$REGCTL_PATH"
          export FRESH_PACKAGING_URL="$PACKAGING_URL"
          export FRESH_UPSTREAM_URL="$UPSTREAM_URL"
          export FRESH_POSTGRES_REF="$POSTGRES_REF"
          export FRESH_MEILI_REF="$MEILI_REF"
          export FRESH_NODE_REF="$NODE_REF"
          export FRESH_RUST_REF="$RUST_REF"
          export FRESH_MONOLITH_VERSION="$MONOLITH_VERSION"
          node ci/publish.mjs publish "$INPUT_JSON" \
            --regctl "$REGCTL_PATH" \
            --staging "${GHCR_BASE}:staging-${GITHUB_RUN_ID}" \
            --ghcr-candidate "${GHCR_BASE}:candidate-${RECIPE_ID}" \
            --ghcr-version "${GHCR_BASE}:${SELECTED_VERSION}" \
            --ghcr-latest "${GHCR_BASE}:latest" \
            --docker-candidate "${docker_base}:candidate-${RECIPE_ID}" \
            --docker-version "${docker_base}:${SELECTED_VERSION}" \
            --docker-latest "${docker_base}:latest" \
            --fresh-command "$FRESH_COMMAND" \
            --result-out "$RUNNER_TEMP/publish-result.json"
          node -e '
            const { appendFileSync, readFileSync } = require("node:fs");
            const resultPath = process.argv[1];
            const result = JSON.parse(readFileSync(resultPath, "utf8"));
            if (!["published", "skipped-stale", "skipped-freshness-error"].includes(result.latest)) {
              throw new Error("Invalid publish result");
            }
            const version = process.env.SELECTED_VERSION;
            let summary;
            if (result.latest === "published") {
              summary = `## Latest moved\n\n- Version \`${version}\` was published or reconciled.\n- The \`latest\` tags were moved to this release.`;
            } else if (result.latest === "skipped-stale") {
              summary = `## Version published; latest unchanged\n\n- Version \`${version}\` was published or reconciled.\n- The \`latest\` tags were not moved because fresher publish inputs were resolved.`;
            } else {
              summary = `## Latest gate resolution failed\n\n- Version \`${version}\` may have been published before freshness resolution failed.\n- The \`latest\` tags were not moved; retry this run to resolve the gate.`;
            }
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
            appendFileSync(process.env.GITHUB_ENV, `LATEST_PUBLISHED=${result.latest === "published"}\n`);
            if (result.latest === "skipped-freshness-error") process.exitCode = 1;
          ' "$result_path"

      - name: Update VERSION pin for the current release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$LATEST_PUBLISHED" != true ]; then
            printf 'Not updating VERSION: latest was not moved by this publish run\n'
            exit 0
          fi
          reconcile_version_pin() {
            git fetch origin main || return 1
            git checkout -B main origin/main || return 1

            latest_version="$(gh api repos/linkwarden/linkwarden/releases/latest --jq .tag_name)" || return 1
            if [ "$SELECTED_VERSION" != "$latest_version" ]; then
              printf 'Not updating VERSION: %s is not the current upstream release %s\n' "$SELECTED_VERSION" "$latest_version"
              return 0
            fi

            current_version="$(tr -d '[:space:]' < VERSION)" || return 1
            if [ "$current_version" = "$SELECTED_VERSION" ]; then
              printf 'VERSION already pins %s\n' "$SELECTED_VERSION"
              return 0
            fi

            printf '%s\n' "$SELECTED_VERSION" > VERSION || return 1
            git config user.name "github-actions[bot]" || return 1
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com" || return 1
            git add VERSION || return 1
            git commit -m "chore: pin VERSION to ${SELECTED_VERSION}" || return 1
            git push origin HEAD:main
          }

          if ! reconcile_version_pin; then
            printf 'VERSION pin push failed; reconciling once with origin/main\n' >&2
            reconcile_version_pin
          fi
