name: build-publish

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream release tag (e.g. v2.15.1). Empty = reviewed build lock."
        required: false
        type: string
        default: ""
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - build-lock.json
      - Dockerfile
      - docker-entrypoint.sh
      - patch-next-standalone.js
      - ci/**
      - .github/workflows/build-publish.yml

env:
  IMAGE_NAME: linkwarden-slim
  # CI infrastructure pins are independent of the application build lock.
  BUILDX_VERSION: v0.38.0
  BUILDKIT_IMAGE: docker.io/moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
  QEMU_IMAGE: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

jobs:
  test-ci:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate workflow structure
        run: bash ci/workflow.test.sh

      - name: Run Node CI tests
        run: node --test ci/*.test.mjs ci/lib/*.test.mjs

      - name: Run shell CI tests
        run: |
          set -euo pipefail
          for test_script in ci/*.test.sh; do
            CI_RUN_NETWORK_TESTS=0 bash "$test_script"
          done

  validate-packaging:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: test-ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate workflow structure
        run: bash ci/workflow.test.sh

      - name: Resolve validation inputs
        id: inputs
        run: |
          set -euo pipefail
          packaging_url="https://github.com/${GITHUB_REPOSITORY}.git"
          regctl_path="$RUNNER_TEMP/regctl"
          bash ci/download-regctl.sh "$regctl_path"
          docker_config="$(mktemp -d "$RUNNER_TEMP/linkwarden-docker-config.XXXXXX")"
          trap 'rm -rf "$docker_config"' EXIT
          export DOCKER_CONFIG="$docker_config"
          REGCTL_PATH="$regctl_path" bash ci/registry-probe.sh
          input_json="$RUNNER_TEMP/linkwarden-validation-input.json"
          node ci/resolve-publish-input.mjs \
            --out "$input_json" \
            --regctl "$regctl_path" \
            --packaging-url "$packaging_url" \
            --packaging-sha "$GITHUB_SHA"
          echo "input_json=$input_json" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          image: ${{ env.QEMU_IMAGE }}
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Validate packaging and source
        run: node ci/publish.mjs validate "${{ steps.inputs.outputs.input_json }}"

  publish:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test-ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    concurrency:
      group: linkwarden-slim-publisher
      cancel-in-progress: false
    steps:
      - name: Checkout this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve publish inputs
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          packaging_url="https://github.com/${GITHUB_REPOSITORY}.git"
          regctl_path="$RUNNER_TEMP/regctl"
          bash ci/download-regctl.sh "$regctl_path"
          docker_config="$(mktemp -d "$RUNNER_TEMP/linkwarden-docker-config.XXXXXX")"
          trap 'rm -rf "$docker_config"' EXIT
          export DOCKER_CONFIG="$docker_config"
          REGCTL_PATH="$regctl_path" bash ci/registry-probe.sh
          input_json="$RUNNER_TEMP/linkwarden-publish-input.json"
          resolver_args=()
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then
            resolver_args=(--upstream-tag "$INPUT_VERSION")
          fi
          node ci/resolve-publish-input.mjs \
            --out "$input_json" \
            --regctl "$regctl_path" \
            --packaging-url "$packaging_url" \
            "${resolver_args[@]}"

          recipe_id="$(node -e 'process.stdout.write(require(process.argv[1]).recipe.recipeId)' "$input_json")"
          version="$(node -e 'process.stdout.write(require(process.argv[1]).upstreamTag)' "$input_json")"
          owner_lc="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          FRESH_ARGS="$(node ci/resolve-publish-input.mjs --print-fresh-args \
            --regctl "$regctl_path" \
            --packaging-url "$packaging_url")"
          {
            echo "INPUT_JSON=$input_json"
            echo "REGCTL_PATH=$regctl_path"
            echo "FRESH_COMMAND=ci/resolve-publish-input.mjs"
            echo "FRESH_ARGS=$FRESH_ARGS"
            echo "SELECTED_VERSION=$version"
            echo "RECIPE_ID=$recipe_id"
            echo "GHCR_BASE=ghcr.io/$owner_lc/$IMAGE_NAME"
          } >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          image: ${{ env.QEMU_IMAGE }}
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate, stage, and publish GHCR
        run: |
          set -euo pipefail
          node ci/publish.mjs publish-ghcr "$INPUT_JSON" \
            --regctl "$REGCTL_PATH" \
            --staging "${GHCR_BASE}:staging-${GITHUB_RUN_ID}" \
            --ghcr-candidate "${GHCR_BASE}:candidate-${RECIPE_ID}" \
            --ghcr-version "${GHCR_BASE}:${SELECTED_VERSION}" \
            --ghcr-latest "${GHCR_BASE}:latest" \
            --fresh-command "$FRESH_COMMAND" \
            --fresh-args "$FRESH_ARGS" \
            --result-out "$RUNNER_TEMP/ghcr-publish-result.json"

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mirror GHCR release to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          docker_base="docker.io/${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
          result_path="$RUNNER_TEMP/publish-result.json"
          node ci/publish.mjs mirror-docker "$INPUT_JSON" \
            --regctl "$REGCTL_PATH" \
            --ghcr-candidate "${GHCR_BASE}:candidate-${RECIPE_ID}" \
            --ghcr-version "${GHCR_BASE}:${SELECTED_VERSION}" \
            --ghcr-latest "${GHCR_BASE}:latest" \
            --docker-version "${docker_base}:${SELECTED_VERSION}" \
            --docker-latest "${docker_base}:latest" \
            --result-in "$RUNNER_TEMP/ghcr-publish-result.json" \
            --result-out "$result_path"
          node ci/summarize-publish.mjs \
            --result "$result_path" \
            --version "$SELECTED_VERSION" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --env "$GITHUB_ENV"
