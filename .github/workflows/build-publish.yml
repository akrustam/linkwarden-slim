name: build-publish

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream release tag (e.g. v2.15.1). Empty = latest release."
        required: false
        type: string
        default: ""
      force:
        description: "Rebuild and push even if GHCR tag already exists"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - .github/workflows/build-publish.yml

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: linkwarden-slim

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FORCE=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_VERSION="${{ inputs.version }}"
            FORCE="${{ inputs.force }}"
            if [ -n "$INPUT_VERSION" ]; then
              VERSION="$INPUT_VERSION"
            else
              VERSION="$(gh api repos/linkwarden/linkwarden/releases/latest --jq .tag_name)"
            fi
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            VERSION="$(gh api repos/linkwarden/linkwarden/releases/latest --jq .tag_name)"
          else
            # path-push on main: pin from VERSION file
            VERSION="$(tr -d '[:space:]' < VERSION)"
          fi
          case "$VERSION" in
            v*.*.*) ;;
            *)
              echo "Refusing non-semver tag: $VERSION" >&2
              exit 1
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "force=$FORCE" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION force=$FORCE"

      - name: Log in to GHCR (for tag SoT inspect)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if GHCR tag exists (SoT)
        id: exists
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          FORCE="${{ steps.ver.outputs.force }}"
          OWNER="${{ github.repository_owner }}"
          # lowercase owner for GHCR
          OWNER_LC="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          REF="ghcr.io/${OWNER_LC}/${IMAGE_NAME}:${VERSION}"
          EXISTS=false
          # Prefer manifest inspect (no Buildx required yet); fall back to buildx.
          if docker manifest inspect "$REF" >/dev/null 2>&1 \
            || docker buildx imagetools inspect "$REF" >/dev/null 2>&1; then
            EXISTS=true
          fi
          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"
          echo "ghcr_ref=$REF" >> "$GITHUB_OUTPUT"
          if [ "$EXISTS" = "true" ] && [ "$FORCE" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "GHCR tag already exists: $REF (skip unless force)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Will build: exists=$EXISTS force=$FORCE"
          fi

      - name: Skip summary
        if: steps.exists.outputs.skip == 'true'
        run: |
          {
            echo "## Skipped"
            echo ""
            echo "GHCR tag already exists: \`${{ steps.exists.outputs.ghcr_ref }}\`"
            echo ""
            echo "Use workflow_dispatch with **force** to rebuild."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout upstream Linkwarden
        if: steps.exists.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: linkwarden/linkwarden
          ref: ${{ steps.ver.outputs.version }}
          path: src

      - name: Copy entrypoint into build context
        if: steps.exists.outputs.skip != 'true'
        run: cp docker-entrypoint.sh ./src/

      - name: Set up QEMU
        if: steps.exists.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.exists.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.exists.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        if: steps.exists.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/linkwarden-slim
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/linkwarden-slim
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest
          flavor: |
            latest=false

      - name: Build and push
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Best-effort commit VERSION pin
        if: steps.exists.outputs.skip != 'true'
        continue-on-error: true
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          CURRENT="$(tr -d '[:space:]' < VERSION || true)"
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "VERSION already $VERSION"
            exit 0
          fi
          echo "$VERSION" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: pin VERSION to ${VERSION}"
          git push

      - name: Job summary
        if: steps.exists.outputs.skip != 'true'
        run: |
          {
            echo "## Published linkwarden-slim"
            echo ""
            echo "- **version:** \`${{ steps.ver.outputs.version }}\`"
            echo "- **platforms:** linux/amd64, linux/arm64"
            echo "- **GHCR:** \`ghcr.io/${{ github.repository_owner }}/linkwarden-slim:${{ steps.ver.outputs.version }}\`"
            echo "- **Hub:** \`docker.io/${{ secrets.DOCKERHUB_USERNAME }}/linkwarden-slim:${{ steps.ver.outputs.version }}\`"
            echo "- **also tagged:** \`latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
