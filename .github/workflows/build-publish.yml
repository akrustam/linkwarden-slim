name: build-publish

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream release tag (e.g. v2.15.1). Empty = latest release."
        required: false
        type: string
        default: ""
      force:
        description: "Reconcile and publish even when version tags already exist"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - patch-next-standalone.js
      - ci/**
      - .github/workflows/build-publish.yml

env:
  IMAGE_NAME: linkwarden-slim
  UPSTREAM_URL: https://github.com/linkwarden/linkwarden.git
  POSTGRES_REF: postgres:16-alpine
  MEILI_REF: getmeili/meilisearch:v1.13.3
  NODE_REF: node:lts-bookworm-slim
  RUST_REF: rust:1.96-bookworm

jobs:
  validate-packaging:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Resolve validation inputs
        id: inputs
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'VERSION must be a release tag, got: %s\n' "$version" >&2
            exit 1
          fi

          tag_refs="$(git ls-remote "$UPSTREAM_URL" "refs/tags/$version^{}" "refs/tags/$version")"
          upstream_sha="$(printf '%s\n' "$tag_refs" | awk -F '\t' -v peeled="refs/tags/$version^{}" '$2 == peeled { print $1; exit }')"
          if [ -z "$upstream_sha" ]; then
            upstream_sha="$(printf '%s\n' "$tag_refs" | awk -F '\t' -v tag="refs/tags/$version" '$2 == tag { print $1; exit }')"
          fi
          if ! [[ "$upstream_sha" =~ ^[a-f0-9]{40}$ ]]; then
            printf 'Unable to resolve upstream tag to an exact SHA: %s\n' "$version" >&2
            exit 1
          fi

          packaging_url="https://github.com/${GITHUB_REPOSITORY}.git"
          packaging_sha="$GITHUB_SHA"
          if ! [[ "$packaging_sha" =~ ^[a-f0-9]{40}$ ]]; then
            printf 'GITHUB_SHA is not an exact lowercase SHA\n' >&2
            exit 1
          fi

          regctl_path="$RUNNER_TEMP/regctl"
          bash ci/download-regctl.sh "$regctl_path"
          docker_config="$(mktemp -d "$RUNNER_TEMP/linkwarden-docker-config.XXXXXX")"
          packaging_dir=""
          trap 'rm -rf "$docker_config" "$packaging_dir"' EXIT
          export DOCKER_CONFIG="$docker_config"
          REGCTL_PATH="$regctl_path" bash ci/registry-probe.sh

          packaging_dir="$(mktemp -d "$RUNNER_TEMP/linkwarden-packaging.XXXXXX")"
          bash ci/materialize-packaging.sh "$packaging_url" "$packaging_sha" "$packaging_dir"
          input_json="$RUNNER_TEMP/linkwarden-validation-input.json"
          node ci/resolve-inputs.mjs \
            --regctl "$regctl_path" \
            --packaging-url "$packaging_url" \
            --packaging-sha "$packaging_sha" \
            --packaging-export "$packaging_dir/export" \
            --upstream-tag "$version" \
            --upstream-url "$UPSTREAM_URL" \
            --upstream-sha "$upstream_sha" \
            --postgres "$POSTGRES_REF" \
            --meili "$MEILI_REF" \
            --node "$NODE_REF" \
            --rust "$RUST_REF" \
            --monolith-version "${version#v}" \
            --out "$input_json"
          echo "input_json=$input_json" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate packaging and source
        run: node ci/publish.mjs validate "${{ steps.inputs.outputs.input_json }}"

  publish:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: linkwarden-slim-publisher
      cancel-in-progress: false
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Resolve publish inputs
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="$(gh api repos/linkwarden/linkwarden/releases/latest --jq .tag_name)"
          fi
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Resolved version must be a release tag, got: %s\n' "$version" >&2
            exit 1
          fi

          tag_refs="$(git ls-remote "$UPSTREAM_URL" "refs/tags/$version^{}" "refs/tags/$version")"
          upstream_sha="$(printf '%s\n' "$tag_refs" | awk -F '\t' -v peeled="refs/tags/$version^{}" '$2 == peeled { print $1; exit }')"
          if [ -z "$upstream_sha" ]; then
            upstream_sha="$(printf '%s\n' "$tag_refs" | awk -F '\t' -v tag="refs/tags/$version" '$2 == tag { print $1; exit }')"
          fi
          if ! [[ "$upstream_sha" =~ ^[a-f0-9]{40}$ ]]; then
            printf 'Unable to resolve upstream tag to an exact SHA: %s\n' "$version" >&2
            exit 1
          fi

          packaging_url="https://github.com/${GITHUB_REPOSITORY}.git"
          packaging_sha="$(git ls-remote "$packaging_url" refs/heads/main | awk -F '\t' '$2 == "refs/heads/main" { print $1; exit }')"
          if ! [[ "$packaging_sha" =~ ^[a-f0-9]{40}$ ]]; then
            printf 'Unable to resolve the default packaging branch to an exact SHA\n' >&2
            exit 1
          fi

          regctl_path="$RUNNER_TEMP/regctl"
          bash ci/download-regctl.sh "$regctl_path"
          docker_config="$(mktemp -d "$RUNNER_TEMP/linkwarden-docker-config.XXXXXX")"
          packaging_dir=""
          trap 'rm -rf "$docker_config" "$packaging_dir"' EXIT
          export DOCKER_CONFIG="$docker_config"
          REGCTL_PATH="$regctl_path" bash ci/registry-probe.sh
          packaging_dir="$(mktemp -d "$RUNNER_TEMP/linkwarden-packaging.XXXXXX")"
          bash ci/materialize-packaging.sh "$packaging_url" "$packaging_sha" "$packaging_dir"

          input_json="$RUNNER_TEMP/linkwarden-publish-input.json"
          node ci/resolve-inputs.mjs \
            --regctl "$regctl_path" \
            --packaging-url "$packaging_url" \
            --packaging-sha "$packaging_sha" \
            --packaging-export "$packaging_dir/export" \
            --upstream-tag "$version" \
            --upstream-url "$UPSTREAM_URL" \
            --upstream-sha "$upstream_sha" \
            --postgres "$POSTGRES_REF" \
            --meili "$MEILI_REF" \
            --node "$NODE_REF" \
            --rust "$RUST_REF" \
            --monolith-version "${version#v}" \
            --out "$input_json"

          fresh_command="$RUNNER_TEMP/resolve-fresh-input.sh"
          cat > "$fresh_command" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          output_path=${1:?fresh input output path is required}
          latest_tag="$(gh api repos/linkwarden/linkwarden/releases/latest --jq .tag_name)"
          if ! [[ "$latest_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Latest upstream release is not a supported tag: %s\n' "$latest_tag" >&2
            exit 1
          fi
          tag_refs="$(git ls-remote "$UPSTREAM_URL" "refs/tags/$latest_tag^{}" "refs/tags/$latest_tag")"
          latest_sha="$(printf '%s\n' "$tag_refs" | awk -F '\t' -v peeled="refs/tags/$latest_tag^{}" '$2 == peeled { print $1; exit }')"
          if [ -z "$latest_sha" ]; then
            latest_sha="$(printf '%s\n' "$tag_refs" | awk -F '\t' -v tag="refs/tags/$latest_tag" '$2 == tag { print $1; exit }')"
          fi
          if ! [[ "$latest_sha" =~ ^[a-f0-9]{40}$ ]]; then
            printf 'Unable to resolve latest upstream tag to an exact SHA: %s\n' "$latest_tag" >&2
            exit 1
          fi
          latest_packaging_sha="$(git ls-remote "$PACKAGING_URL" refs/heads/main | awk -F '\t' '$2 == "refs/heads/main" { print $1; exit }')"
          if ! [[ "$latest_packaging_sha" =~ ^[a-f0-9]{40}$ ]]; then
            printf 'Unable to resolve the default packaging branch to an exact SHA\n' >&2
            exit 1
          fi
          fresh_packaging_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/linkwarden-fresh-packaging.XXXXXX")"
          trap 'rm -rf "$fresh_packaging_dir"' EXIT
          bash ci/materialize-packaging.sh "$PACKAGING_URL" "$latest_packaging_sha" "$fresh_packaging_dir"
          node ci/resolve-inputs.mjs \
            --regctl "$REGCTL_PATH" \
            --packaging-url "$PACKAGING_URL" \
            --packaging-sha "$latest_packaging_sha" \
            --packaging-export "$fresh_packaging_dir/export" \
            --upstream-tag "$latest_tag" \
            --upstream-url "$UPSTREAM_URL" \
            --upstream-sha "$latest_sha" \
            --postgres "$POSTGRES_REF" \
            --meili "$MEILI_REF" \
            --node "$NODE_REF" \
            --rust "$RUST_REF" \
            --monolith-version "${latest_tag#v}" \
            --out "$output_path"
          EOF
          chmod 0755 "$fresh_command"

          recipe_id="$(node -e 'process.stdout.write(require(process.argv[1]).recipe.recipeId)' "$input_json")"
          owner_lc="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            echo "INPUT_JSON=$input_json"
            echo "REGCTL_PATH=$regctl_path"
            echo "FRESH_COMMAND=$fresh_command"
            echo "SELECTED_VERSION=$version"
            echo "RECIPE_ID=$recipe_id"
            echo "GHCR_BASE=ghcr.io/$owner_lc/$IMAGE_NAME"
            echo "PACKAGING_URL=$packaging_url"
          } >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate, stage, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          docker_base="docker.io/${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
          node ci/publish.mjs publish "$INPUT_JSON" \
            --regctl "$REGCTL_PATH" \
            --staging "${GHCR_BASE}:staging-${GITHUB_RUN_ID}" \
            --ghcr-candidate "${GHCR_BASE}:candidate-${RECIPE_ID}" \
            --ghcr-version "${GHCR_BASE}:${SELECTED_VERSION}" \
            --ghcr-latest "${GHCR_BASE}:latest" \
            --docker-candidate "${docker_base}:candidate-${RECIPE_ID}" \
            --docker-version "${docker_base}:${SELECTED_VERSION}" \
            --docker-latest "${docker_base}:latest" \
            --fresh-command "$FRESH_COMMAND"

      - name: Update VERSION pin for the current release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_version="$(gh api repos/linkwarden/linkwarden/releases/latest --jq .tag_name)"
          if [ "$SELECTED_VERSION" != "$latest_version" ]; then
            printf 'Not updating VERSION: %s is not the current upstream release %s\n' "$SELECTED_VERSION" "$latest_version"
            exit 0
          fi
          current_version="$(tr -d '[:space:]' < VERSION)"
          if [ "$current_version" = "$SELECTED_VERSION" ]; then
            printf 'VERSION already pins %s\n' "$SELECTED_VERSION"
            exit 0
          fi
          printf '%s\n' "$SELECTED_VERSION" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: pin VERSION to ${SELECTED_VERSION}"
          git push

      - name: Job summary
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          {
            echo "## Published linkwarden-slim"
            echo
            echo "- **version:** \`${SELECTED_VERSION}\`"
            echo "- **recipe:** \`${RECIPE_ID}\`"
            echo "- **GHCR:** \`${GHCR_BASE}:${SELECTED_VERSION}\`"
            echo "- **Hub:** \`docker.io/${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${SELECTED_VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"
